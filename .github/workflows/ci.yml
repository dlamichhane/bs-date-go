name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - go-version-file: go.mod # minimum version declared in go.mod
          - go-version: stable # latest Go release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - run: go vet ./...
      - run: go test -race -cover ./...
